    const SUPABASE_URL = "https://irlarzynvelqvihoxtpj.supabase.co";

    // Inicializa o cliente antes de carregar o código principal.
    window.pedeiaSupabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const appScript = document.createElement("script");
    appScript.src = "/app.js";
    appScript.onload = () => {
      if (typeof window.bootstrap === "function") {
        window.bootstrap();
      } else if (typeof bootstrap === "function") {
        bootstrap();
      } else {
        console.error("Inicialização do PedeIA: função bootstrap não encontrada.");
